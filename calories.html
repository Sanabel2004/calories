<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب السعرات الحرارية</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            padding: 25px;
            max-width: 600px;
            margin: 25px auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        #bmiBox {
            background-color: #f1f8f4;
            border: 1px solid #c8e6c9;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        #bmiBox h2 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        #bmiResult {
            font-weight: bold;
            font-size: 16px;
        }

        .bmi-under {
            background-color: #e3f2fd;
            border-color: #90caf9;
            color: #1565c0;
        }

        .bmi-normal {
            background-color: #e8f5e9;
            border-color: #66bb6a;
            color: #2e7d32;
        }

        .bmi-over {
            background-color: #fff3e0;
            border-color: #ffb74d;
            color: #ef6c00;
        }

        .bmi-obese {
            background-color: #ffebee;
            border-color: #ef9a9a;
            color: #c62828;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            background-color: #f1f8f4;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        #caloriesResult {
            font-weight: bold;
            font-size: 16px;
        }

        footer {
            text-align: center;
            margin: 20px 0;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>
<header>
    <h1>حساب السعرات الحرارية</h1>
    <p>أدخل بياناتك لمعرفة حالتك الصحية</p>
</header>
<main>
    <div id="bmiBox">
        <h2>مؤشر كتلة الجسم (BMI)</h2>
        <p id="bmiResult">أدخل الوزن والطول لعرض النتيجة</p>
    </div>
    <form>
        <label>الجنس</label>
        <select id="gender">
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
        </select>

        <label>العمر (سنة)</label>
        <input type="number" id="age" required>

        <label>الوزن (كغ)</label>
        <input type="number" id="weight" required>

        <label>الطول (بالمتر)</label>
        <input type="number" step="0.01" id="height" required>

        <label>مستوى النشاط</label>
        <select id="activity">
            <option value="1.0">قليل النشاط</option>
            <option value="1.11">نشاط خفيف</option>
            <option value="1.26">نشاط متوسط</option>
            <option value="1.48">نشاط عالي جدًا</option>
        </select>

        <button type="button" onclick="calculateAll()">احسب</button>
    </form>

    <div id="result">
        <p id="caloriesResult"></p>
    </div>

</main>
<footer>
    <p>ريشة رقمية</p>
</footer>

<script>
function calculateAll() {
    const gender = document.getElementById("gender").value;
    const age = Number(document.getElementById("age").value);
    const weight = Number(document.getElementById("weight").value);
    const height = Number(document.getElementById("height").value);
    const PA = Number(document.getElementById("activity").value);

    if (!age || !weight || !height) return;

  
    const bmi = weight / (height * height);
    const bmiBox = document.getElementById("bmiBox");
    bmiBox.className = "";

    let status = "";
    if (bmi < 18.5) {
        status = "نحافة";
        bmiBox.classList.add("bmi-under");
    } else if (bmi < 25) {
        status = "وزن طبيعي";
        bmiBox.classList.add("bmi-normal");
    } else if (bmi < 30) {
        status = "زيادة وزن";
        bmiBox.classList.add("bmi-over");
    } else {
        status = "سمنة";
        bmiBox.classList.add("bmi-obese");
    }

    document.getElementById("bmiResult").innerText =
        `BMI = ${bmi.toFixed(1)} (${status})`;

  
    let EER;
    if (gender === "male") {
        EER = 662 - (9.53 * age) + PA * ((15.91 * weight) + (539.6 * height));
    } else {
        EER = 354 - (6.91 * age) + PA * ((9.36 * weight) + (726 * height));
    }

    document.getElementById("caloriesResult").innerText =
        `احتياجك اليومي من السعرات: ${Math.round(EER)} سعرة حرارية`;
}
</script>

</body>
</html>
